  "llama-index-vector-stores-chroma==0.1.8",
  "llama-index-vector-stores-qdrant==0.2.8",
  "llama-index-tools-duckduckgo==0.1.1",
  "llama-index-tools-wikipedia==0.1.3",
  "langchain==0.2.12",
  "chromadb==0.5.5",
  "qdrant-client==1.10.1",
  "pydantic==2.8.2",
  "python-dotenv==1.0.1",
  "requests==2.32.3",
