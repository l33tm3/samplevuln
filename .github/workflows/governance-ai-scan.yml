name: Governance AI Pipeline Scan

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.json"
      - "**/*.toml"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.md"
      - "pyproject.toml"
      - "package.json"
      - ".github/workflows/governance-ai-scan.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.js"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.json"
      - "**/*.toml"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.md"
      - "pyproject.toml"
      - "package.json"
      - ".github/workflows/governance-ai-scan.yml"

permissions:
  contents: read
  packages: read
  id-token: write

env:
  GOVERNANCE_AI_API_URL: https://nummular-nonidyllic-jayla.ngrok-free.dev

jobs:
  governance-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate pipeline configuration
        env:
          GOVERNANCE_AI_PROJECT_SLUG: ${{ vars.GOVERNANCE_AI_PROJECT_SLUG }}
          GOVERNANCE_AI_TOKEN: ${{ secrets.GOVERNANCE_AI_TOKEN }}
          GOVERNANCE_AI_SCANNER_IMAGE: ${{ vars.GOVERNANCE_AI_SCANNER_IMAGE }}
        run: |
          if [ -z "${GOVERNANCE_AI_PROJECT_SLUG}" ]; then
            echo "Missing repository variable: GOVERNANCE_AI_PROJECT_SLUG" >&2
            exit 1
          fi
          if [ -z "${GOVERNANCE_AI_TOKEN}" ]; then
            echo "Missing repository secret: GOVERNANCE_AI_TOKEN" >&2
            exit 1
          fi
          if [ -z "${GOVERNANCE_AI_SCANNER_IMAGE}" ]; then
            echo "Missing repository variable: GOVERNANCE_AI_SCANNER_IMAGE" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Governance AI scanner image
        run: docker pull "${{ vars.GOVERNANCE_AI_SCANNER_IMAGE }}"

      - name: Run AI scan
        env:
          GOVERNANCE_AI_PROJECT_SLUG: ${{ vars.GOVERNANCE_AI_PROJECT_SLUG }}
        run: |
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            "${{ vars.GOVERNANCE_AI_SCANNER_IMAGE }}" scan \
            --path . \
            --provider github \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-id "${GITHUB_REPOSITORY_ID}" \
            --project-slug "${GOVERNANCE_AI_PROJECT_SLUG}" \
            --commit-sha "${GITHUB_SHA}" \
            --branch "${GITHUB_REF_NAME}" \
            --trigger-type "${GITHUB_EVENT_NAME}" \
            --external-run-id "${GITHUB_RUN_ID}" \
            --external-job-id "governance-scan" \
            --scanner-version "${GITHUB_SHA}" \
            --format json > scan.json

      - name: Send results to Governance AI intake
        env:
          GOVERNANCE_AI_TOKEN: ${{ secrets.GOVERNANCE_AI_TOKEN }}
        run: |
          curl --fail-with-body -X POST "${GOVERNANCE_AI_API_URL}/api/v1/pipeline-scans/intake" \
            -H "Authorization: Bearer ${GOVERNANCE_AI_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @scan.json
