name: Governance AI Pipeline Scan

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  GOVERNANCE_AI_API_URL: https://api.governanceai.com

jobs:
  governance-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get scanner access from Governance AI
        env:
          GOVERNANCE_AI_TOKEN: ${{ secrets.GOVERNANCE_AI_TOKEN }}
          GOVERNANCE_AI_PROJECT_SLUG: ${{ vars.GOVERNANCE_AI_PROJECT_SLUG }}
        run: |
          curl --fail-with-body -sS -X POST "${GOVERNANCE_AI_API_URL}/api/v1/pipeline-scans/scanner-access" \
            -H "Authorization: Bearer ${GOVERNANCE_AI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"project_slug\":\"${GOVERNANCE_AI_PROJECT_SLUG}\",\"provider\":\"github\",\"repository\":\"${GITHUB_REPOSITORY}\",\"repository_id\":\"${GITHUB_REPOSITORY_ID}\"}" \
            > scanner-access.json

      - name: Log in to private scanner registry
        run: |
          export SCANNER_REGISTRY=$(python -c "import json; print(json.load(open('scanner-access.json'))['registry'])")
          export SCANNER_USERNAME=$(python -c "import json; print(json.load(open('scanner-access.json'))['username'])")
          export SCANNER_PASSWORD=$(python -c "import json; print(json.load(open('scanner-access.json'))['password'])")
          echo "$SCANNER_PASSWORD" | docker login "$SCANNER_REGISTRY" -u "$SCANNER_USERNAME" --password-stdin

      - name: Run AI scan
        env:
          GOVERNANCE_AI_PROJECT_SLUG: ${{ vars.GOVERNANCE_AI_PROJECT_SLUG }}
        run: |
          export SCANNER_IMAGE=$(python -c "import json; print(json.load(open('scanner-access.json'))['image'])")
          docker pull "$SCANNER_IMAGE"
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$SCANNER_IMAGE" scan \
            --path . \
            --provider github \
            --repository "${GITHUB_REPOSITORY}" \
            --repository-id "${GITHUB_REPOSITORY_ID}" \
            --project-slug "${GOVERNANCE_AI_PROJECT_SLUG}" \
            --commit-sha "${GITHUB_SHA}" \
            --branch "${GITHUB_REF_NAME}" \
            --trigger-type "${GITHUB_EVENT_NAME}" \
            --external-run-id "${GITHUB_RUN_ID}" \
            --external-job-id "governance-scan" \
            --scanner-version "${GITHUB_SHA}" \
            --format json > scan.json

      - name: Send results to Governance AI intake
        env:
          GOVERNANCE_AI_TOKEN: ${{ secrets.GOVERNANCE_AI_TOKEN }}
        run: |
          curl --fail-with-body -X POST "${GOVERNANCE_AI_API_URL}/api/v1/pipeline-scans/intake" \
            -H "Authorization: Bearer ${GOVERNANCE_AI_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @scan.json
