name: Governance AI Pipeline Scan

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  GOVERNANCE_AI_API_URL: ${{ vars.GOVERNANCE_AI_API_URL }}

# Expected repo variable:
# GOVERNANCE_AI_PROJECT_SLUG=governance
# GOVERNANCE_AI_API_URL=https://your-governance-ai-host
# Optional repo variable for a dedicated Shadow AI alert flow:
# GOVERNANCE_AI_SHADOW_AI_ALERT_URL=https://your-alert-endpoint

jobs:
  governance-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate pipeline configuration
        env:
          GOVERNANCE_AI_TOKEN: ${{ secrets.GOVERNANCE_AI_TOKEN }}
          GOVERNANCE_AI_PROJECT_SLUG: ${{ vars.GOVERNANCE_AI_PROJECT_SLUG }}
        run: |
          set -euo pipefail
          test -n "$GOVERNANCE_AI_API_URL"
          test -n "$GOVERNANCE_AI_TOKEN"
          test -n "$GOVERNANCE_AI_PROJECT_SLUG"

      - name: Get scanner access from Governance AI
        env:
          GOVERNANCE_AI_TOKEN: ${{ secrets.GOVERNANCE_AI_TOKEN }}
          GOVERNANCE_AI_PROJECT_SLUG: ${{ vars.GOVERNANCE_AI_PROJECT_SLUG }}
        run: |
          set -euo pipefail
          API_BASE="${GOVERNANCE_AI_API_URL%/}"
          curl --fail-with-body -sS -X POST "$API_BASE/api/v1/pipeline-scans/scanner-access" \
            -H "Authorization: Bearer $GOVERNANCE_AI_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"project_slug\":\"$GOVERNANCE_AI_PROJECT_SLUG\",\"provider\":\"github\",\"repository\":\"$GITHUB_REPOSITORY\",\"repository_id\":\"$GITHUB_REPOSITORY_ID\"}" \
            -o scanner-access.json

      - name: Log in to private scanner registry
        run: |
          set -euo pipefail
          export SCANNER_REGISTRY=$(jq -r '.registry // ""' scanner-access.json)
          export SCANNER_IMAGE=$(jq -r '.image // ""' scanner-access.json)
          export SCANNER_USERNAME=$(jq -r '.username // ""' scanner-access.json)
          export SCANNER_PASSWORD=$(jq -r '.password // ""' scanner-access.json)
          test -n "$SCANNER_REGISTRY"
          test -n "$SCANNER_IMAGE"
          test -n "$SCANNER_USERNAME"
          test -n "$SCANNER_PASSWORD"
          echo "$SCANNER_PASSWORD" | docker login "$SCANNER_REGISTRY" -u "$SCANNER_USERNAME" --password-stdin

      - name: Run AI scan
        env:
          GOVERNANCE_AI_PROJECT_SLUG: ${{ vars.GOVERNANCE_AI_PROJECT_SLUG }}
        run: |
          set -euo pipefail
          export SCANNER_IMAGE=$(jq -r '.image // ""' scanner-access.json)
          docker pull "$SCANNER_IMAGE"
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            "$SCANNER_IMAGE" scan \
            --path . \
            --provider github \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --project-slug "$GOVERNANCE_AI_PROJECT_SLUG" \
            --commit-sha "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME" \
            --trigger-type "$GITHUB_EVENT_NAME" \
            --external-run-id "$GITHUB_RUN_ID" \
            --external-job-id "governance-scan" \
            --scanner-version "$GITHUB_SHA" \
            --format json > scan.json

      - name: Send results to Governance AI intake
        env:
          GOVERNANCE_AI_TOKEN: ${{ secrets.GOVERNANCE_AI_TOKEN }}
        run: |
          set -euo pipefail
          API_BASE="${GOVERNANCE_AI_API_URL%/}"
          curl --fail-with-body -sS -X POST "$API_BASE/api/v1/pipeline-scans/intake" \
            -H "Authorization: Bearer $GOVERNANCE_AI_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @scan.json

      - name: Build Shadow AI alert payload
        id: shadow_ai_alert
        env:
          GOVERNANCE_AI_PROJECT_SLUG: ${{ vars.GOVERNANCE_AI_PROJECT_SLUG }}
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          jq \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg provider "github" \
            --arg project_slug "$GOVERNANCE_AI_PROJECT_SLUG" \
            --arg run_url "$RUN_URL" '
            def provider_label($value):
              ($value | ascii_downcase) as $provider
              | if $provider == "github" then "GitHub"
                elif $provider == "gitlab" then "GitLab"
                else $value
                end;
            def signal_tag:
              (.signal_type? // .type? // .kind? // .category? // .classification? // .reason? // "");
            def signal_count:
              if (.signal_count? | type) == "number" then .signal_count
              elif (.count? | type) == "number" then .count
              elif (.signals? | type) == "array" then (.signals | length)
              elif (.matches? | type) == "array" then (.matches | length)
              else 1
              end;
            def has_shadow_ai_label:
              (.labels? // [])
              | if type == "array" then
                  map(tostring | ascii_downcase)
                  | any(. == "shadow_ai" or . == "shadow ai" or . == "undeclared_repository")
                else
                  false
                end;
            [
              .. | objects |
              select(
                (.shadow_ai? == true)
                or has_shadow_ai_label
                or (
                  (signal_tag | tostring | ascii_downcase) as $tag
                  | $tag == "shadow_ai"
                  or $tag == "undeclared_repository"
                  or ($tag | contains("shadow"))
                  or ($tag | contains("undeclared"))
                )
              ) |
              {
                status: "Shadow / undeclared",
                title: (
                  "No Declarado - "
                  + ((.repository // .repo // $repository) | tostring)
                  + " - "
                  + provider_label((.provider // .repository_provider // $provider) | tostring)
                ),
                repository: ((.repository // .repo // $repository) | tostring),
                provider: provider_label((.provider // .repository_provider // $provider) | tostring),
                risk: ((.risk // .severity // .priority // "unknown") | tostring),
                pipeline_enforcement: (
                  (
                    .pipeline_enforcement
                    // .pipeline_enforce
                    // .enforcement_mode
                    // (if (.blocked? // .block_pipeline? // .enforced? // false) then "blocked" else "observing" end)
                  ) | tostring
                ),
                detail_url: ((.detail_url // .url // .html_url // $run_url) | tostring),
                signal_type: ((signal_tag // "shadow_ai") | tostring),
                signal_count: signal_count
              }
            ] as $alerts |
            {
              alert_type: "shadow_ai",
              project_slug: $project_slug,
              repository: $repository,
              provider: provider_label($provider),
              alerts: ($alerts | unique_by([.title, .signal_type, .detail_url]))
            }' scan.json > shadow-ai-alert.json

          ALERT_COUNT="$(jq '.alerts | length' shadow-ai-alert.json)"
          echo "count=$ALERT_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$ALERT_COUNT" -gt 0 ]; then
            echo "has_alerts=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Shadow AI alerts"
              jq -r '.alerts[] | "- \(.title) | Risk: \(.risk) | Pipeline enforce: \(.pipeline_enforcement) | Detail: \(.detail_url)"' shadow-ai-alert.json
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_alerts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Shadow AI alert
        if: ${{ steps.shadow_ai_alert.outputs.has_alerts == 'true' && vars.GOVERNANCE_AI_SHADOW_AI_ALERT_URL != '' }}
        env:
          GOVERNANCE_AI_TOKEN: ${{ secrets.GOVERNANCE_AI_TOKEN }}
          GOVERNANCE_AI_SHADOW_AI_ALERT_URL: ${{ vars.GOVERNANCE_AI_SHADOW_AI_ALERT_URL }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "$GOVERNANCE_AI_SHADOW_AI_ALERT_URL" \
            -H "Authorization: Bearer $GOVERNANCE_AI_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @shadow-ai-alert.json

      - name: Warn about missing Shadow AI alert endpoint
        if: ${{ steps.shadow_ai_alert.outputs.has_alerts == 'true' && vars.GOVERNANCE_AI_SHADOW_AI_ALERT_URL == '' }}
        run: |
          echo "::warning::Shadow AI alerts were detected, but GOVERNANCE_AI_SHADOW_AI_ALERT_URL is not configured."
